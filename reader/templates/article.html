{% extends "base.html" %}
{% block title %}{{ entry.title }} · 我的 RSS{% endblock %}
{% block main %}
<article>
  <a href="{{ url_for('index', feed=entry.feed_id) }}">返回订阅</a>
  <p class="muted">{{ entry.source }} · {{ (entry.published or entry.added) | localtime }}</p>
  <h1>{{ entry.title }}</h1>
  {% include "article_body.html" %}
</article>
{% endblock %}
